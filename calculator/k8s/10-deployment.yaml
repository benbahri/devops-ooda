apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  namespace: calculator-lab
  labels:
    app: calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime : un pod n'est retire qu'une fois son remplacant pret
      maxSurge: 1
  template:
    metadata:
      labels:
        app: calculator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: calculator
          image: calculator:1.0.0       # remplace par la pipeline (kubectl set image)
          imagePullPolicy: IfNotPresent # l'image est chargee dans kind (kind load docker-image)
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
